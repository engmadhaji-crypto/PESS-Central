<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#002244"><meta name="application-name" content="PESS"><link rel="manifest" href="/manifest.webmanifest"><title>PESS V28</title><style>:root{--p:#002244;--ok:#0f7a3a;--bad:#b91c1c;--warn:#f59e0b;--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'Noto Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.mono{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--mut)}.small{font-size:13px}.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-l{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;font-size:14px}
.card{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 3px #0f172a14;border:1px solid var(--bd)}
.card.warn{border-color:#fcd34d;background:#fffbeb}
.card.cust,.card.contract{border-right:5px solid #64748b;cursor:pointer}
.app-h{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--p),#0f7a3a);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.app-h b{font-size:18px}
.content{padding:12px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
.bottom{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.bottom button{flex:1;min-height:60px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:12px}
.bottom button.on{color:var(--ok);font-weight:700}.bottom .ico{font-size:20px}
.bottom button.on .ico{background:#0f7a3a22;border-radius:14px;padding:2px 14px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--p);color:#fff;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--p);border:1px solid var(--bd)}
.btn.primary{background:var(--ok)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn);color:#111}
.btn.block{width:100%}.link{background:none;border:0;color:#2563eb;font-weight:700;cursor:pointer;padding:4px}
.x{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut);padding:4px 8px}.x.small{font-size:14px;padding:0 4px}
.inp{width:100%;min-height:44px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.inp:focus{outline:2px solid #2563eb55;border-color:#2563eb}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut);min-width:0}
.form{display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;flex-direction:column;gap:8px}.toolbar .inp{flex:1}
.sortbar{display:flex;gap:8px}.sortbar .inp{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.chip{color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpis.small{grid-template-columns:repeat(2,1fr)}

.kpi-l{font-size:12px;color:var(--mut)}.kpi-v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}.kpi-s{font-size:12px;color:var(--mut)}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:8px 10px}
.warn-t{color:#b45309;font-weight:700}.ok-t{color:var(--ok)}.late{color:#b45309}.late-row td{background:#fffbeb}
.phones{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ph{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border-radius:999px;padding:4px 10px}
.ph a{text-decoration:none;color:var(--p)}
.head h2{margin:0;font-size:20px}
.contract details{margin-top:6px}.contract summary{cursor:pointer;color:#2563eb;font-weight:700;padding:4px 0}
.calc{font-size:14px;color:var(--mut)}
.opt{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:right;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer;margin-top:6px}
.opt span{color:var(--mut);font-size:13px}
.overlay{position:fixed;inset:0;background:#0f172a80;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.modal.wide{max-width:820px}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.tbl th{background:#1e293b;color:#fff;padding:6px;font-weight:700;white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.tbl td.name{text-align:right;font-weight:700}
.tbl tfoot td{background:var(--bg);font-weight:800}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,#002244,#0f7a3a)}
.login-card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;padding:22px}
.logo{font-size:32px;font-weight:900;color:var(--p);text-align:center}
.audit{padding:4px 0;border-bottom:1px solid var(--bd)}
.page{background:#fff;color:#0b1220;padding:10mm;border-radius:10px;box-shadow:0 1px 3px #0f172a22}
.st-h{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid var(--p);padding-bottom:8px}
.st-h h2{margin:0;color:var(--p);font-size:20px}.st-meta{text-align:left;font-size:13px}
.st-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.st-kpis div{background:#f1f5f9;border-radius:8px;padding:6px;text-align:center}.st-kpis b{display:block;font-size:16px}.st-kpis small{color:#475569}
.st-c{border:1px solid #cbd5e1;border-radius:8px;padding:8px;margin:8px 0;break-inside:avoid}
.st-c table th{background:#334155}.st-c table td{font-size:12.5px}
.st-tot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:var(--p);color:#fff;border-radius:8px;padding:10px;margin-top:10px}
.st-sign{display:flex;justify-content:space-around;margin-top:24px;text-align:center}
.st-sign div{border-top:1px solid #0b1220;padding-top:4px;width:40%;font-size:13px}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff}
  .no-print,.bottom,.app-h,.shell>header{display:none!important}
  .content{padding:0;max-width:none}
  .page{box-shadow:none;padding:0;border-radius:0}

  .toolbar{flex-direction:row;align-items:center;flex-wrap:wrap}
  .overlay{align-items:center}.modal{border-radius:20px}
}
.app-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hd-logo{background:#fff;border-radius:12px;padding:3px 8px;display:flex;align-items:center;justify-content:center;min-width:56px;min-height:40px}

.hd-t{text-align:left;font-size:17px}.hd-s{opacity:.9}
.chk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--bg);border-radius:10px;padding:6px 8px}

.hdr-prev img{max-height:56px;max-width:120px;object-fit:contain}
.hdr-mid{text-align:center}.btn.block{width:100%}
.stm-h{display:flex}
.hdr-prev{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;border-bottom:2px solid var(--p);padding-bottom:8px}
.hdr-mid{text-align:center}.hdr-mid img{height:56px;max-width:110px;object-fit:contain}
.hdr-side{font-size:13px;min-width:0}.hdr-side:last-child{text-align:left}
.hdr-side b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.st-h{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;border-bottom:3px solid var(--p);padding-bottom:8px}
.st-m img{height:56px;max-width:110px;object-fit:contain}.st-r{text-align:left}.st-l{text-align:right}
.st-sign{display:flex;justify-content:space-around;margin-top:20px;text-align:center}
.fbar{position:sticky;top:52px;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fef3c7;color:#78350f;padding:8px 12px;font-size:14px;border-bottom:1px solid #fcd34d}
.hl{background:#fef3c7 !important}
.flash{animation:flashbg 2.4s ease-out 1}

.btn.danger,.danger{color:#b91c1c !important}
.profit-box{border-right:4px solid #0f7a3a;background:#f0fdf4}
.profit-line{color:#0f7a3a}

/* PESS V28 UI refinement */
:root{--p:#082f49;--p2:#0f766e;--ok:#15803d;--bg:#f4f7fb;--card:#fff;--tx:#102033;--mut:#64748b;--bd:#dbe4ee;--shadow:0 8px 24px rgba(15,23,42,.07)}
body{background:radial-gradient(circle at 100% 0,#e6f3f1 0,transparent 28%),var(--bg);letter-spacing:.01em}

.app-h{background:linear-gradient(110deg,#082f49 0%,#0f766e 100%);box-shadow:0 3px 18px #082f4930}

.content{padding:16px 14px calc(100px + env(safe-area-inset-bottom,0px))}

.head h2{font-size:21px;letter-spacing:-.02em}.toolbar{gap:10px;padding:12px;background:linear-gradient(180deg,#fff,#f8fafc);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shadow)}
.toolbar .sortbar{min-width:min(100%,360px)}.sortbar .inp{background:#fff;font-weight:700}.chips{scrollbar-width:thin}.pill{font-weight:700;color:#334155}.pill:hover{border-color:#94a3b8;background:#f8fafc}.pill.on{background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 4px 10px #0f766e26}
.btn{box-shadow:0 3px 8px #0f172a12}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.03)}.btn.ghost{background:#fff}.btn.danger{border-color:#fecaca!important;background:#fff5f5!important;color:#b91c1c!important}
.cust .row-l:first-child b,.contract .row-l:first-child b{font-size:16px}.cust .row-l:last-child{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.bottom{box-shadow:0 -5px 20px #0f172a12;background:#ffffffee;backdrop-filter:blur(12px)}.bottom button{min-height:64px}.bottom button.on{color:var(--p2)}.bottom button.on .ico{background:#0f766e1c}
.fbar{top:58px;border-radius:0 0 12px 12px;box-shadow:0 4px 12px #78350f18}.err{box-shadow:0 3px 10px #991b1b0d}
.tbl th{background:linear-gradient(135deg,#1e293b,#334155);padding:8px}.tbl td{padding:8px}.tbl tbody tr:hover td{background:#f8fafc}.tbl-wrap{border-radius:12px}
.modal{box-shadow:0 -10px 40px #0f172a30}.actions{gap:10px}.x:hover{background:#f1f5f9;border-radius:8px}
@media (min-width:760px){.content{padding-left:20px;padding-right:20px}.toolbar{flex-direction:row;align-items:center}.toolbar>.chips{flex:1}.toolbar .sortbar{flex:0 1 390px}.bottom{box-shadow:0 -3px 16px #0f172a10}}
